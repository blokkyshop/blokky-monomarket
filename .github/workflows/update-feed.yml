name: Update MonoMarket feed

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python convert.py
        env:
          SOURCE_FEED_URL: ${{ secrets.SOURCE_FEED_URL }}
          OUTPUT_PATH: docs/mono.json
          LIMIT: "0"
          MAX_PAY_IN_PARTS: "7"
          DAYS_TO_DISPATCH: "2"
          WAREHOUSE_ID: "1"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mono.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update MonoMarket feed"
          git push
